name: Backend tests

on:
  push:
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/rfs_test
      SECRET_KEY: ci-only-test-secret-not-used-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend suite
        run: python -m pytest -p no:cacheprovider -q
