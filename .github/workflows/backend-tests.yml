name: Backend tests

on:
  push:
    paths:
      - backend/**
      - supabase/migrations/**
      - supabase/verify_access.sql
      - supabase/verify_staff_chat_actions.sql
      - .github/workflows/backend-tests.yml
  pull_request:
    paths:
      - backend/**
      - supabase/migrations/**
      - supabase/verify_access.sql
      - supabase/verify_staff_chat_actions.sql
      - .github/workflows/backend-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/rfs_test
      SECRET_KEY: ci-only-test-secret-not-used-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend suite
        run: python -m pytest -p no:cacheprovider -q

  staff-chat-postgres:
    name: Staff-chat PostgreSQL 17 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only-password
          POSTGRES_DB: rfs_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rfs_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RFS_CHAT_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only-password@127.0.0.1:5432/rfs_chat_test
      RFS_CHAT_REQUIRE_INTEGRATION: '1'
      SECRET_KEY: ci-only-test-secret-not-used-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run required real-database concurrency and rollback checks
        run: python -m pytest --confcutdir=tests/integration -p no:cacheprovider -q tests/integration/test_staff_chat_postgres.py
