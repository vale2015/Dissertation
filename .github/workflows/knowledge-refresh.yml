name: Validate and publish RFS research

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: rfs-knowledge-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ vars.RFS_RESEARCH_BOT_LOGIN != '' &&
          vars.RFS_RESEARCH_BOT_ID != '' &&
          github.event.issue.user.login == vars.RFS_RESEARCH_BOT_LOGIN &&
          format('{0}', github.event.issue.user.id) == vars.RFS_RESEARCH_BOT_ID &&
          startsWith(github.event.issue.title, 'RFS research input ') &&
          !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic publisher
        run: python -B -m unittest discover -s tools/feature_discovery/tests -p 'test_*.py' -q
      - name: Publish validated input
        shell: bash
        env:
          RESEARCH_BOT_LOGIN: ${{ vars.RFS_RESEARCH_BOT_LOGIN }}
          RESEARCH_BOT_ID: ${{ vars.RFS_RESEARCH_BOT_ID }}
        run: |
          set -euo pipefail
          python -B tools/feature_discovery/pipeline.py extract-issue --root . --event "$GITHUB_EVENT_PATH" --actor "$RESEARCH_BOT_LOGIN" --user-id "$RESEARCH_BOT_ID" --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/rfs-scan-input.json"
          python -B -c 'import json, subprocess, sys; expected=json.load(open(sys.argv[1], encoding="utf-8"))["base_repository_commit"]; actual=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(); sys.exit(0 if expected == actual else "Research input was based on an older main commit; collect again before publication.")' "$RUNNER_TEMP/rfs-scan-input.json"
          python -B tools/feature_discovery/pipeline.py refresh --root . --input "$RUNNER_TEMP/rfs-scan-input.json"
          python -B tools/feature_discovery/pipeline.py validate --root .
          git add -- docs/knowledge/discoveries.json docs/knowledge/scan_state.json docs/knowledge/html-output/index.html docs/knowledge/scan_history
          if git diff --cached --quiet; then
            echo "Research snapshot unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(knowledge): publish validated research snapshot"
          git push origin HEAD:main
