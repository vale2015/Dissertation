name: Migration replay

on:
  push:
    paths:
      - .github/workflows/migration-replay.yml
      - supabase/migrations/**
      - supabase/schema_snapshot.sql
      - supabase/verify_access.sql
  pull_request:
    paths:
      - .github/workflows/migration-replay.yml
      - supabase/migrations/**
      - supabase/schema_snapshot.sql
      - supabase/verify_access.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    container: postgres:17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Supabase-style client roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO service_role;
          SQL
      - name: Replay every migration on an empty database
        run: |
          set -eu
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Check application tables and protected access
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relkind = 'r'
                  AND c.relname IN ('users', 'bookings', 'restaurant_demand_features',
                    'staff_roles', 'staffing_rules', 'staff_cost_forecast',
                    'business_settings', 'user_account_tokens', 'staff_account_audit',
                    'auth_rate_limits', 'report_history', 'forecast_runs',
                    'forecast_run_days', 'active_forecast_run',
                    'service_actual_covers', 'service_actual_corrections',
                    'in_app_notifications')) <> 17 THEN
              RAISE EXCEPTION 'Expected all 17 application tables';
            END IF;
            IF (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relrowsecurity
                  AND c.relname IN ('users', 'bookings', 'restaurant_demand_features',
                    'staff_roles', 'staffing_rules', 'staff_cost_forecast',
                    'business_settings', 'user_account_tokens', 'staff_account_audit',
                    'auth_rate_limits', 'report_history', 'forecast_runs',
                    'forecast_run_days', 'active_forecast_run',
                    'service_actual_covers', 'service_actual_corrections',
                    'in_app_notifications')) <> 17 THEN
              RAISE EXCEPTION 'Expected RLS on all 17 application tables';
            END IF;
            IF has_table_privilege('anon', 'public.bookings', 'SELECT')
              OR has_table_privilege('authenticated', 'public.bookings', 'SELECT')
              OR has_table_privilege('anon', 'public.auth_rate_limits', 'SELECT')
              OR has_table_privilege('authenticated', 'public.auth_rate_limits', 'SELECT')
              OR has_table_privilege('anon', 'public.in_app_notifications', 'SELECT')
              OR has_table_privilege('authenticated', 'public.in_app_notifications', 'SELECT')
              OR has_sequence_privilege('anon', 'public.bookings_id_seq', 'USAGE') THEN
              RAISE EXCEPTION 'Server-only objects grant client access';
            END IF;
          END $$;
          SQL
      - name: Print application-schema fingerprint
        run: psql -v ON_ERROR_STOP=1 -At -f supabase/schema_snapshot.sql
      - name: Verify least-privilege access
        run: psql -v ON_ERROR_STOP=1 -f supabase/verify_access.sql
      - name: Verify forecast snapshots cannot be rewritten
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE saved_run_id bigint;
          BEGIN
            INSERT INTO public.forecast_runs
              (selected_date, days_ahead, model_name, model_version, prediction)
            VALUES ('2026-10-22', 7, 'test', 'test-sha', '{}'::jsonb)
            RETURNING id INTO saved_run_id;
            INSERT INTO public.forecast_run_days
              (run_id, day_index, forecast_date, predicted_covers, closed)
            VALUES (saved_run_id, 1, '2026-10-23', 1, false);
            INSERT INTO public.staff_cost_forecast
              (run_id, forecast_date, predicted_covers, department, role_name,
               required_staff, hourly_rate, shift_hours, estimated_cost)
            VALUES (saved_run_id, '2026-10-23', 1, 'Kitchen', 'Chef', 1, 12, 8, 96);
            BEGIN
              UPDATE public.forecast_runs SET model_version = 'rewritten'
              WHERE id = saved_run_id;
              RAISE EXCEPTION 'Expected run update rejection';
            EXCEPTION WHEN others THEN
              IF SQLERRM <> 'Forecast snapshots are immutable' THEN RAISE; END IF;
            END;
            BEGIN
              DELETE FROM public.forecast_run_days WHERE run_id = saved_run_id;
              RAISE EXCEPTION 'Expected day deletion rejection';
            EXCEPTION WHEN others THEN
              IF SQLERRM <> 'Forecast snapshots are immutable' THEN RAISE; END IF;
            END;
            BEGIN
              UPDATE public.staff_cost_forecast SET estimated_cost = 1
              WHERE run_id = saved_run_id;
              RAISE EXCEPTION 'Expected staffing update rejection';
            EXCEPTION WHEN others THEN
              IF SQLERRM <> 'Forecast snapshots are immutable' THEN RAISE; END IF;
            END;
          END $$;
          SQL
      - name: Verify served-cover correction history cannot be rewritten
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE saved_user_id bigint;
          DECLARE saved_correction_id bigint;
          BEGIN
            INSERT INTO public.users (full_name, email, password_hash)
            VALUES ('Migration tester', 'migration-test@example.invalid', 'not-a-login')
            RETURNING id INTO saved_user_id;
            INSERT INTO public.service_actual_covers
              (service_date, actual_covers, recorded_by)
            VALUES ('2026-10-23', 40, saved_user_id);
            INSERT INTO public.service_actual_corrections
              (service_date, previous_covers, corrected_covers, reason, corrected_by)
            VALUES ('2026-10-23', 40, 41, 'Count corrected', saved_user_id)
            RETURNING id INTO saved_correction_id;
            BEGIN
              UPDATE public.service_actual_corrections SET corrected_covers = 42
              WHERE id = saved_correction_id;
              RAISE EXCEPTION 'Expected correction update rejection';
            EXCEPTION WHEN others THEN
              IF SQLERRM <> 'Actual-cover correction history is immutable' THEN RAISE; END IF;
            END;
            BEGIN
              DELETE FROM public.service_actual_corrections WHERE id = saved_correction_id;
              RAISE EXCEPTION 'Expected correction deletion rejection';
            EXCEPTION WHEN others THEN
              IF SQLERRM <> 'Actual-cover correction history is immutable' THEN RAISE; END IF;
            END;
          END $$;
          SQL
