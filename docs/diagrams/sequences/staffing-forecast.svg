  <text x="73" y="1046.44" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">FAILURE BEHAVIOUR</text>
  <text x="282" y="1046.96" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">An incomplete forecast, unmatched band or missing required role returns HTTP 422. The previous active run stays in</text>
  <text x="282" y="1069.96" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">place.</text>
