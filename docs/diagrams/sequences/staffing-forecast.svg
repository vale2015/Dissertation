  <rect x="1229.0" y="208" width="154" height="65" rx="7" fill="#E7F4EF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="1306.0" y="247.96" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <polyline points="1306,274 1306,949" stroke-width="1.5" stroke-linejoin="round" fill="none" stroke="#B7CAC6" stroke-dasharray="6 5" />
  <polyline points="54,289 1347,289" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="324.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">01</text>
  <text x="100" y="326.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Request 7 or 10 days with the selected base date</text>
  <polyline points="597,320 774.25,320" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="54,355 1347,355" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="390.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">02</text>
  <text x="100" y="392.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Forward POST /staff-cost/forecast</text>
  <polyline points="774.25,386 951.5,386" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="54,421 1347,421" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="456.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">03</text>
  <text x="100" y="458.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Generate dated cover estimates</text>
  <polyline points="951.5,452 1128.75,452" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="54,487 1347,487" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="522.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">04</text>
  <text x="100" y="524.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Return predicted covers and closure flags</text>
  <polyline points="1128.75,518 951.5,518" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#385876" stroke-dasharray="6 5" marker-end="url(#arrow385876)" />
  <polyline points="54,553 1347,553" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="588.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">05</text>
  <text x="100" y="590.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Validate that the horizon is complete</text>
  <polyline points="951.5,572 988.5,572 988.5,594 953.5,594" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#775118" marker-end="url(#arrow775118)" />
  <polyline points="54,619 1347,619" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="654.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">06</text>
  <text x="100" y="656.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Read cover bands and operational role rates</text>
  <polyline points="951.5,650 1306,650" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="54,685 1347,685" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="720.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">07</text>
  <text x="100" y="722.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Insert run, day rows and eligible role costs</text>
  <polyline points="951.5,716 1306,716" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="54,751 1347,751" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="786.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">08</text>
  <text x="100" y="788.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Switch the active pointer and commit</text>
  <polyline points="951.5,782 1306,782" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="54,817 1347,817" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="852.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">09</text>
  <text x="100" y="854.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Return HTTP 201 with run and daily totals</text>
  <polyline points="951.5,848 774.25,848" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#385876" stroke-dasharray="6 5" marker-end="url(#arrow385876)" />
  <polyline points="54,883 1347,883" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="56" y="918.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">10</text>
  <text x="100" y="920.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Display staffing by day, department and role</text>
  <polyline points="774.25,914 597,914" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#385876" stroke-dasharray="6 5" marker-end="url(#arrow385876)" />
