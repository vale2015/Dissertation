<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1113" viewBox="0 0 1400 1113" role="img" aria-labelledby="title desc">
  <title id="title">Generate a staffing forecast</title>
  <desc id="desc">A complete staffing horizon becomes a saved forecast run in one transaction. Adds the protected POST, immutable run/day/cost records, activation and rollback conditions.</desc>
  <defs>
    <marker id="arrow14685C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14685C" />
    </marker>
    <marker id="arrow385876" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#385876" />
    </marker>
    <marker id="arrow142F35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#142F35" />
    </marker>
    <marker id="arrow775118" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#775118" />
    </marker>
    <marker id="arrow425F62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#425F62" />
    </marker>
  </defs>
  <rect width="1400" height="1113" fill="#F9FBF9" />
  <rect x="0" y="0" width="12" height="1113" rx="0" fill="#14685C" stroke="none" stroke-width="1.4" />
  <text x="54" y="46.28" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">RFS  /  REQUEST SEQUENCES</text>
  <text x="54" y="101.28" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="start">Generate a staffing forecast</text>
  <text x="55" y="146.48" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">A complete staffing horizon becomes a saved forecast run in one transaction.</text>
  <polyline points="54,177 1346,177" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <text x="55" y="228.44" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">OPERATION</text>
  <text x="55" y="265.48" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Read from top to bottom</text>
  <rect x="520.0" y="208" width="154" height="65" rx="7" fill="#E7F4EF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="597.0" y="247.96" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Planner UI</text>
  <polyline points="597,274 597,949" stroke-width="1.5" stroke-linejoin="round" fill="none" stroke="#B7CAC6" stroke-dasharray="6 5" />
  <rect x="697.25" y="208" width="154" height="65" rx="7" fill="#E7F4EF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="774.25" y="247.96" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Next.js proxy</text>
  <polyline points="774.25,274 774.25,949" stroke-width="1.5" stroke-linejoin="round" fill="none" stroke="#B7CAC6" stroke-dasharray="6 5" />
  <rect x="874.5" y="208" width="154" height="65" rx="7" fill="#E7F4EF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="951.5" y="247.96" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Staff service</text>
  <polyline points="951.5,274 951.5,949" stroke-width="1.5" stroke-linejoin="round" fill="none" stroke="#B7CAC6" stroke-dasharray="6 5" />
  <rect x="1051.75" y="208" width="154" height="65" rx="7" fill="#E7F4EF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="1128.75" y="247.96" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Prediction</text>
