<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="981" viewBox="0 0 1400 981" role="img" aria-labelledby="title desc">
  <title id="title">Read staffing rules</title>
  <desc id="desc">Managers can inspect the demand bands and operational role rates used for staffing. Shows the manager permission gate and the two read-only queries used by the page.</desc>
