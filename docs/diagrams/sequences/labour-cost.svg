  <title id="title">Read labour and revenue estimates</title>
  <desc id="desc">The dashboard compares forecast labour with a revenue estimate derived from recent demand. Replaces a speculative date-specific labour endpoint with the implemented dashboard read and its mixed reporting periods.</desc>
