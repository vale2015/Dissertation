<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1054" viewBox="0 0 1400 1054" role="img" aria-labelledby="title desc">
  <title id="title">Frontend architecture</title>
  <desc id="desc">The App Router shares a guarded dashboard shell across role-aware operational pages. Refreshes the route and component inventory. Includes server API handlers and the manager assistant.</desc>
