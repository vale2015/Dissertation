<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="977" viewBox="0 0 1400 977" role="img" aria-labelledby="title desc">
  <title id="title">Sign-in and planning flow</title>
  <desc id="desc">Original concept · the manager signs in, chooses a planning task and can end the session. Extracts the embedded decision flow, keeping the retry branch and the 7/10-day planning choices.</desc>
  <defs>
    <marker id="arrow14685C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14685C" />
    </marker>
    <marker id="arrow385876" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#385876" />
    </marker>
    <marker id="arrow142F35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#142F35" />
    </marker>
    <marker id="arrow775118" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#775118" />
    </marker>
    <marker id="arrow425F62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#425F62" />
    </marker>
  </defs>
  <rect width="1400" height="977" fill="#F9FBF9" />
  <rect x="0" y="0" width="12" height="977" rx="0" fill="#775118" stroke="none" stroke-width="1.4" />
  <text x="54" y="46.28" fill="#775118" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">RFS  /  ORIGINAL DESIGN RESEARCH</text>
  <text x="54" y="101.28" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="start">Sign-in and planning flow</text>
  <text x="55" y="146.48" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Original concept · the manager signs in, chooses a planning task and can end the session.</text>
  <polyline points="54,177 1346,177" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <polyline points="371,293 520,293" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="880,293 1028,293" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="1205,375 1205,412 230,412 230,375" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="700,375 700,444" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="700,609 700,641 248,641 248,674" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="700,609 700,674" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <polyline points="700,609 700,641 1153,641 1153,674" stroke-width="2.5" stroke-linejoin="round" fill="none" stroke="#14685C" marker-end="url(#arrow14685C)" />
  <rect x="54" y="209" width="317" height="166" rx="8" fill="#FFFFFF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="74" y="238.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">START</text>
  <text x="74" y="277.84" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Login page</text>
  <text x="74" y="310.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">The manager enters</text>
  <text x="74" y="337.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">credentials.</text>
  <rect x="520" y="209" width="360" height="166" rx="8" fill="#E7F4EF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="540" y="238.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">DECISION</text>
  <text x="540" y="277.84" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Credentials valid?</text>
  <text x="540" y="310.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">A valid login opens the dashboard.</text>
  <rect x="1028" y="209" width="317" height="166" rx="8" fill="#FAEFDA" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="1048" y="238.6" fill="#775118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">IF INVALID</text>
  <text x="1048" y="277.84" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Show an error</text>
  <text x="1048" y="310.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Return to the login page and</text>
  <text x="1048" y="337.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">retry.</text>
  <rect x="493" y="444" width="414" height="165" rx="8" fill="#E7F4EF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="513" y="473.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">IF VALID</text>
  <text x="513" y="512.84" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Dashboard</text>
  <text x="513" y="545.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Choose an operational task or log out.</text>
  <rect x="54" y="674" width="378" height="161" rx="8" fill="#FFFFFF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="74" y="703.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">BOOKINGS</text>
  <text x="74" y="742.84" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Review or add</text>
  <text x="74" y="775.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Open the bookings overview or enter</text>
  <text x="74" y="802.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">a new booking.</text>
  <rect x="504" y="674" width="392" height="161" rx="8" fill="#FFFFFF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="524" y="703.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">PLANNING</text>
  <text x="524" y="742.84" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Review forecasts</text>
  <text x="524" y="775.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Select 7 or 10 days; review demand,</text>
  <text x="524" y="802.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">staffing and labour costs.</text>
  <rect x="965" y="674" width="380" height="161" rx="8" fill="#FFFFFF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="985" y="703.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">OTHER DESTINATIONS</text>
  <text x="985" y="742.84" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Rules, reports or logout</text>
  <text x="985" y="775.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Inspect rules, review a period</text>
  <text x="985" y="802.8" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">summary or end the session.</text>
  <rect x="54" y="875" width="1292" height="68" rx="6" fill="#E7F4EF" stroke="none" stroke-width="1.4" />
  <text x="73" y="910.44" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">SOURCE CONTEXT</text>
  <text x="282" y="910.96" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">This flow describes the original manager-facing concept. The current role matrix appears in the architecture set.</text>
</svg>
