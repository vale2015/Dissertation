<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="798" viewBox="0 0 1400 798" role="img" aria-labelledby="title desc">
  <title id="title">Prototype SWOT analysis</title>
  <desc id="desc">Historical assessment · strengths, weaknesses, opportunities and threats recorded on the design board. Restores the four-quadrant reading order and explicitly preserves the empty Opportunities quadrant.</desc>
  <defs>
    <marker id="arrow14685C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14685C" />
    </marker>
    <marker id="arrow385876" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#385876" />
    </marker>
    <marker id="arrow142F35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#142F35" />
    </marker>
    <marker id="arrow775118" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#775118" />
    </marker>
    <marker id="arrow425F62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#425F62" />
    </marker>
  </defs>
  <rect width="1400" height="798" fill="#F9FBF9" />
  <rect x="0" y="0" width="12" height="798" rx="0" fill="#775118" stroke="none" stroke-width="1.4" />
  <text x="54" y="46.28" fill="#775118" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">RFS  /  ORIGINAL DESIGN RESEARCH</text>
  <text x="54" y="101.28" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="start">Prototype SWOT analysis</text>
  <text x="55" y="146.48" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Historical assessment · strengths, weaknesses, opportunities and threats recorded on the design board.</text>
  <polyline points="54,177 1346,177" stroke-width="1" stroke-linejoin="round" fill="none" stroke="#B7CAC6" />
  <rect x="54" y="205" width="630" height="221" rx="8" fill="#FFFFFF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="77" y="234.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">INTERNAL · POSITIVE</text>
  <text x="77" y="273.68" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Strengths</text>
  <text x="77" y="313.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">A simple manager dashboard connects historical booking</text>
  <text x="77" y="342.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">and cover data to staffing recommendations, labour</text>
  <text x="77" y="371.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">estimates and closure-aware forecasts. Tables, charts and</text>
  <text x="77" y="400.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">summary cards communicate the results.</text>
  <rect x="716" y="205" width="630" height="221" rx="8" fill="#FFFFFF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="739" y="234.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">INTERNAL · NEGATIVE</text>
  <text x="739" y="273.68" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Weaknesses</text>
  <text x="739" y="313.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Small datasets and inconsistent historical quality can limit</text>
  <text x="739" y="342.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">accuracy. At the time, weather and local events had limited</text>
  <text x="739" y="371.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">integration. Labour estimates used predefined rules in place</text>
  <text x="739" y="400.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">of payroll data.</text>
  <rect x="54" y="446" width="630" height="192" rx="8" fill="#FFFFFF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="77" y="475.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">EXTERNAL · POSITIVE</text>
  <text x="77" y="514.68" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Opportunities</text>
  <text x="77" y="554.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">The original board left this quadrant empty.</text>
  <rect x="716" y="446" width="630" height="192" rx="8" fill="#FFFFFF" stroke="#B7CAC6" stroke-width="1.4" />
  <text x="739" y="475.6" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">EXTERNAL · NEGATIVE</text>
  <text x="739" y="514.68" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">Threats</text>
  <text x="739" y="554.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Commercial platforms offer broader functions. Unpredictable</text>
  <text x="739" y="583.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">demand, small datasets and differences in restaurant rules</text>
  <text x="739" y="612.64" fill="#425F62" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">or staffing needs can reduce the prototype’s fit.</text>
  <rect x="54" y="696" width="1292" height="68" rx="6" fill="#E7F4EF" stroke="none" stroke-width="1.4" />
  <text x="73" y="731.44" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">RESEARCH STATUS</text>
  <text x="282" y="731.96" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">The statements reflect the original prototype assessment. They do not establish current integration or release status.</text>
</svg>
