  <text x="70" y="293.8" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">01 Start the day</text>
  <text x="410" y="293.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Sign in to begin planning.</text>
  <text x="887" y="293.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Secure dashboard access.</text>
  <rect x="54" y="323" width="1292" height="60" rx="0" fill="#F0F5F2" stroke="none" stroke-width="1.4" />
  <text x="70" y="353.8" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">02 Review demand</text>
  <text x="410" y="353.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Check predicted covers.</text>
