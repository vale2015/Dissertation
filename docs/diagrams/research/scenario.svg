  <text x="70" y="413.8" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">03 Plan staffing</text>
  <text x="410" y="413.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Review staff recommendations.</text>
  <text x="887" y="413.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Staff forecast.</text>
  <rect x="54" y="443" width="1292" height="60" rx="0" fill="#F0F5F2" stroke="none" stroke-width="1.4" />
  <text x="70" y="473.8" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">04 Control costs</text>
  <text x="410" y="473.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Compare demand with staffing needs.</text>
  <text x="887" y="473.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Labour cost information.</text>
  <rect x="54" y="503" width="1292" height="60" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4" />
  <text x="70" y="533.8" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">05 Monitor bookings</text>
  <text x="410" y="533.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Review the booking overview.</text>
  <text x="887" y="533.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Booking records and trends.</text>
  <rect x="54" y="563" width="1292" height="60" rx="0" fill="#F0F5F2" stroke="none" stroke-width="1.4" />
  <text x="70" y="593.8" fill="#14685C" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">06 Make a decision</text>
  <text x="410" y="593.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Adjust planning based on the forecast.</text>
  <text x="887" y="593.8" fill="#142F35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Decision-support information.</text>
